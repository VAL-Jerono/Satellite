# railway.toml — Railway.app deployment
# Each service deploys from the same repo root
# https://docs.railway.app/deploy/config-as-code

[build]
builder = "DOCKERFILE"

# ── API service (set Dockerfile path in Railway dashboard: docker/Dockerfile.api)
# ── Frontend service (set Dockerfile path: docker/Dockerfile.frontend)
# ── Both share the same repo; Railway lets you pick the Dockerfile per service
