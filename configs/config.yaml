# ─── Training ────────────────────────────────────────────────────────────────
training:
  year: 2021
  per_class_per_region: 400   # stratified samples from EE
  cloud_thresh: 0.6           # Cloud Score+ cs_cdf
  block_deg: 0.05             # spatial block size (≈5.5 km)
  n_folds: 5
  patch_size: 64              # pixels (64×64 at 10 m = 640 m tile)
  batch_size: 32
  epochs: 30
  lr: 1.0e-3
  weight_decay: 1.0e-4
  seed: 42
  num_workers: 2
  mixed_precision: true       # fp16 on GPU, ignored on CPU
  gradient_accumulation: 4    # effective batch = batch_size × ga_steps

# ─── Model ───────────────────────────────────────────────────────────────────
model:
  backbone: "efficientnet_b0"   # "resnet18" | "efficientnet_b0"
  in_channels: 10               # B2..B12 (10 Sentinel-2 bands)
  num_classes: 6
  pretrained: "imagenet"        # "imagenet" | "none"
  dropout: 0.3

# ─── Serving / ONNX ──────────────────────────────────────────────────────────
serving:
  onnx_opset: 17
  input_shape: [1, 10, 64, 64]
  providers: ["CPUExecutionProvider"]   # CPU-first

# ─── Paths ───────────────────────────────────────────────────────────────────
paths:
  raw_csv: "data/raw/samples_2021_n400.csv"
  patches_dir: "data/patches"
  splits_dir: "data/splits"
  mlflow_uri: "file:./mlruns"
  model_dir: "models"

# ─── API ─────────────────────────────────────────────────────────────────────
api:
  host: "0.0.0.0"
  port: 8000
  tile_cache_dir: "/tmp/tiles"
  model_path: "models/land_cover.onnx"

# ─── Monitoring ──────────────────────────────────────────────────────────────
monitoring:
  reference_data: "data/splits/reference_features.parquet"
  drift_report_dir: "monitoring/reports"
